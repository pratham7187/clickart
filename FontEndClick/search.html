<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search Results - ClickKart</title>
  <link rel="stylesheet" href="style.css" />
  <script src="api.js"></script>
  <style>
    .product-item {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px;
      text-align: center;
      width: 200px;
      display: inline-block;
      vertical-align: top;
    }
    .product-item img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>Search Results</h1>
  </header>

  <main>
    <input type="text" id="search-bar" placeholder="Search for products..." />
    <button onclick="searchProducts()">Search</button>
    <div id="search-results"></div>
  </main>

<script>
  // Helper: read ?query= from URL
  function getQueryParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  // ── Search function ───────────────────────────────────────────────
  // CHANGED: was fetch("127.0.0.1:5000/api/search?query=") (Flask, no JWT)
  // Now uses apiSearchProducts() → GET /api/products/search?keyword= (public endpoint)
  async function searchProducts() {
    const searchTerm       = document.getElementById("search-bar").value.trim();
    const resultsContainer = document.getElementById("search-results");
    resultsContainer.innerHTML = "";

    if (!searchTerm) {
      resultsContainer.innerHTML = "<p>Please enter a search term.</p>";
      return;
    }

    resultsContainer.innerHTML = `<p style='color:#888;'>Searching for "<strong>${searchTerm}</strong>"...</p>`;

    try {
      const res      = await apiSearchProducts(searchTerm);
      const products = res.data; // Array of ProductResponse

      resultsContainer.innerHTML = "";

      if (!products || products.length === 0) {
        resultsContainer.innerHTML = `<p>No products found for "<strong>${searchTerm}</strong>".</p>`;
        return;
      }

      products.forEach(product => {
        // CHANGED: Spring Boot uses product.imageUrl and product.id (not product.image / product._id)
        const productDiv = document.createElement("div");
        productDiv.className = "product-item";
        productDiv.style.cursor = "pointer";
        productDiv.innerHTML = `
          <img src="${product.imageUrl}" alt="${product.name}" onerror="this.src='image/logo.png'" />
          <h3>${product.name}</h3>
          <p>${formatPrice(product.price)}</p>
          <p style="font-size:12px;color:${product.stock > 0 ? '#4caf50' : '#f44336'}">
            ${product.stock > 0 ? "In Stock" : "Out of Stock"}
          </p>
        `;
        productDiv.onclick = () => {
          localStorage.setItem("ck_productId", product.id);
          window.location.href = "product.html";
        };
        resultsContainer.appendChild(productDiv);
      });
    } catch (error) {
      console.error("Search error:", error);
      resultsContainer.innerHTML = `<p style='color:#e53935;'>Error fetching results: ${error.message}</p>`;
    }
  }

  // Auto-run search if ?query= param is present (called by search.js navigation)
  window.onload = function () {
    const query = getQueryParam("query");
    if (query) {
      document.getElementById("search-bar").value = query;
      searchProducts();
    }
  };
</script>

</body>
</html>
