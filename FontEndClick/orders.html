<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders - ClickKart</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css" />
  <script src="api.js"></script>
</head>
<body>

  <!-- Sidebar -->
  <div class="menu">
    <ul class="menu-content">
      <li><a href="index.html"><span><i class="fa-solid fa-house"></i></span><span>Home</span></a></li>
      <li><a href="cart.html"><span><i class="fa-solid fa-cart-shopping"></i></span><span>Cart</span></a></li>
      <li><a href="wishlist.html"><span><i class="fa-solid fa-heart"></i></span><span>Wishlist</span></a></li>
      <li><a href="profile.html"><span><i class="fa-solid fa-user"></i></span><span>Profile</span></a></li>
      <li class="active"><a href="orders.html"><span><i class="fa-solid fa-box"></i></span><span>Orders</span></a></li>
      <li><a href="logout.html"><span><i class="fa-solid fa-right-from-bracket"></i></span><span>Logout</span></a></li>
    </ul>
  </div>

  <!-- Main content -->
  <div class="main-content">

    <!-- Navbar -->
    <header>
      <div class="navBar">
        <div class="logo">
          <img src="images/image/logo.png" class="clickkart-logo" alt="ClickKart" />
        </div>
        <div class="nav-buttons">
          <button class="login-btn" onclick="window.location.href='cart.html'">
            <i class="fa-solid fa-cart-shopping"></i> Cart
          </button>
        </div>
      </div>
    </header>

    <!-- Orders content -->
    <div class="orders-page-content">
      <h1><i class="fa-solid fa-box" style="color:var(--pink);margin-right:10px;"></i>My Orders</h1>
      <div class="orders-list" id="orders-container">
        <div class="state-msg" style="grid-column:1/-1">
          <i class="fa-solid fa-spinner fa-spin"></i>
          Loading your orders…
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      <div class="footer-grid">
        <div class="footer-column"><h4>ABOUT</h4><p>Contact Us</p><p>About Us</p><p>Careers</p></div>
        <div class="footer-column"><h4>HELP</h4><p>Payments</p><p>Shipping</p><p>Returns</p></div>
        <div class="footer-column"><h4>POLICY</h4><p>Return Policy</p><p>Terms Of Use</p><p>Privacy</p></div>
        <div class="footer-column"><h4>CONTACT</h4><p>Puttur, Karnataka</p><p>6282695997</p><p>clickkart@gmail.com</p></div>
      </div>
      <div class="footer-bottom"><p>&copy; 2025 Clickkart.com</p></div>
    </footer>
  </div>

  <script>
    // ── Auth guard ──────────────────────────────────────────────────────────
    if (!requireAuth()) { /* requireAuth already redirected */ }

    // Status badge config (color + background)
    const STATUS_STYLE = {
      PLACED    : { bg: "#fff3e0", color: "#e65100", label: "⏳ Placed"    },
      CONFIRMED : { bg: "#e3f2fd", color: "#1565c0", label: "✔ Confirmed"  },
      SHIPPED   : { bg: "#f3e5f5", color: "#6a1b9a", label: "🚚 Shipped"   },
      DELIVERED : { bg: "#e8f5e9", color: "#2e7d32", label: "✅ Delivered"  },
      CANCELLED : { bg: "#ffebee", color: "#b71c1c", label: "✖ Cancelled"  }
    };

    window.onload = async function () {
      const container = document.getElementById("orders-container");

      try {
        const res    = await apiGetOrders();
        const orders = res.data;

        container.innerHTML = "";

        if (!orders || orders.length === 0) {
          container.innerHTML = `
            <div class="state-msg" style="grid-column:1/-1">
              <i class="fa-solid fa-box-open"></i>
              You have no orders yet.<br>
              <a class="continue-link" href="index.html">
                <i class="fa-solid fa-arrow-left"></i>&nbsp; Start Shopping
              </a>
            </div>`;
          return;
        }

        orders.forEach(order => {
          const s    = STATUS_STYLE[order.status] || { bg:"#f5f5f5", color:"#666", label: order.status };
          const date = formatDate(order.orderedAt);

          const div = document.createElement("div");
          div.className = "order-item";
          div.innerHTML = `
            <div class="order-details">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
                <h3 style="margin:0;">Order #${order.id}</h3>
                <span class="status-badge"
                  style="background:${s.bg};color:${s.color};">
                  ${s.label}
                </span>
              </div>

              <p><strong>Total:</strong>
                <span style="color:var(--pink);font-weight:700;font-size:1.05rem;">
                  ${formatPrice(order.totalAmount)}
                </span>
              </p>
              <p><strong>Ordered On:</strong> ${date}</p>
              <p><strong>Pincode:</strong> ${order.pincode}</p>
              <p style="line-height:1.5"><strong>Address:</strong><br>
                <span style="color:var(--txt-muted);font-size:0.85rem;">${order.address}</span>
              </p>
            </div>
          `;

          container.appendChild(div);
        });

      } catch (err) {
        container.innerHTML = `
          <div class="state-msg error" style="grid-column:1/-1">
            <i class="fa-solid fa-circle-exclamation"></i>
            Error loading orders: ${err.message}
          </div>`;
      }
    };
  </script>
</body>
</html>
