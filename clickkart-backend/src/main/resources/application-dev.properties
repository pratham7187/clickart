# =============================================================================
#  application-dev.properties
#  Active when: --spring.profiles.active=dev
#
#  Purpose: Overrides for local development.
#  These values take priority over application.properties when dev is active.
# =============================================================================

# Show more SQL detail in dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Seed data mode — change to "always" only if you need to re-run data.sql
spring.sql.init.mode=never

# More verbose security logs during active development
logging.level.org.springframework.security=DEBUG
logging.level.com.clickkart=DEBUG

# Actuator — show all details in dev
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,beans,mappings,env
