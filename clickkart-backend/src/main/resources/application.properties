# =============================================================================
#  ClickKart Backend — Application Configuration (DEV Profile)
#  File     : application.properties
#  Profile  : default (active when no profile is specified)
#  Location : src/main/resources/application.properties
#
#  HOW PROFILES WORK
#  -----------------
#  Spring Boot merges this file with a profile-specific file at startup:
#    dev  → application-dev.properties  (local development)
#    prod → application-prod.properties (production server)
#
#  To activate a profile:
#    IntelliJ : Run Config → Active profiles → "dev"
#    CLI      : java -jar clickkart-backend.jar --spring.profiles.active=prod
#    Maven    : mvn spring-boot:run -Dspring-boot.run.profiles=dev
# =============================================================================


# =============================================================================
#  SERVER
# =============================================================================

# Port the embedded Tomcat listens on
server.port=8080

# Context path for all endpoints — keep as / for simplicity
# (avoids needing /clickkart prefix on every API call)
server.servlet.context-path=/

# Tomcat connection timeout (milliseconds)
server.tomcat.connection-timeout=20000

# Compress HTTP responses larger than 2KB (reduces payload for slow networks)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/plain
server.compression.min-response-size=2048


# =============================================================================
#  DATASOURCE — MySQL 8
#  IMPORTANT: Change username/password to match your local MySQL installation.
#             Do NOT commit real credentials to Git.
#             Use environment variables in production (see application-prod.properties).
# =============================================================================

# JDBC URL parameters explained:
#   useSSL=false                 → disable SSL for local dev (enable in prod)
#   serverTimezone=Asia/Kolkata  → ensures timestamps are stored/read in IST
#   allowPublicKeyRetrieval=true → required for MySQL 8 authentication plugin
#   characterEncoding=UTF-8      → ensures emoji/Unicode product names are stored correctly
#   useUnicode=true              → enables full Unicode support
spring.datasource.url=jdbc:mysql://localhost:3306/clickkart_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true

spring.datasource.username=root
spring.datasource.password=Roman@7187

# MySQL 8 JDBC driver class (use this, not the old com.mysql.jdbc.Driver)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (Spring Boot's default — fastest Java pool)
# These values are tuned for a single-developer local setup.
# Increase pool-size for multi-user production traffic.
spring.datasource.hikari.pool-name=ClickKartHikariPool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000


# =============================================================================
#  JPA / HIBERNATE
# =============================================================================

# DDL AUTO — controls whether Hibernate modifies the DB schema on startup.
#
#   IMPORTANT: Use "validate" once the schema is created by clickkart_schema.sql.
#   Hibernate will verify that the DB schema matches the @Entity definitions.
#   If there is a mismatch (e.g., a missing column), startup FAILS with a clear
#   error — much safer than silently running with wrong data.
#
#   DO NOT use "create" or "create-drop" in development after your first run.
#   Those options drop and recreate ALL tables, losing all your seed data.
#
#   Options reference:
#     validate     → Verify schema matches entities. FAIL on mismatch. (Recommended)
#     update       → Alter schema to match entities. Never drops columns. (Use with caution)
#     create       → DROP + CREATE tables on every startup. Destroys data.
#     create-drop  → CREATE on startup, DROP on shutdown. For unit tests only.
#     none         → Do nothing. Fully manual schema management.
spring.jpa.hibernate.ddl-auto=validate

# Show generated SQL in the console — helps during development/debugging
spring.jpa.show-sql=true

# Pretty-print the SQL (adds line breaks and indentation)
spring.jpa.properties.hibernate.format_sql=true

# MySQL 8 dialect — tells Hibernate to generate MySQL-compatible SQL syntax
# (uses LIMIT instead of ROWNUM, FULLTEXT index hints, etc.)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Defer datasource initialization — ensures data.sql runs AFTER Hibernate
# creates/validates the schema, not before.
spring.jpa.defer-datasource-initialization=true

# Use column names as-is from @Column(name="...") without converting to snake_case
# (We use explicit column names on all entities, so this prevents double-conversion)
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Batch inserts — improves performance when inserting multiple rows (e.g., seeding)
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Enable Hibernate statistics in dev — shows query counts, cache hits
# Set to false in production (performance overhead)
spring.jpa.properties.hibernate.generate_statistics=false


# =============================================================================
#  SQL INITIALIZATION (Seed Data)
#  Spring Boot can run data.sql automatically on startup.
#
#  IMPORTANT: Set mode to "always" only when you need to re-seed.
#             Once seeded, change to "never" to prevent duplicate inserts.
#
#  The data.sql file must use INSERT IGNORE or ON DUPLICATE KEY UPDATE
#  to be idempotent (safe to run multiple times).
# =============================================================================
spring.sql.init.mode=never
# spring.sql.init.data-locations=classpath:data.sql


# =============================================================================
#  JWT CONFIGURATION
#  These values are read by JwtUtil.java via @Value annotations.
#
#  SECRET KEY REQUIREMENTS (HS256):
#    • Minimum 256 bits = 32 characters (ASCII) or base64-encoded string
#    • Must be random, not guessable, not a real word or phrase
#    • NEVER commit a real production secret to Git
#    • In production: use an environment variable or secrets manager
#
#  GENERATE A SECURE SECRET (run in any terminal):
#    Linux/Mac : openssl rand -base64 64
#    PowerShell: [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(64))
#
#  EXPIRATION:
#    86400000 ms = 24 hours
#    3600000  ms = 1 hour
# =============================================================================
app.jwt.secret=ClickKartDevSecretKey2025PleaseReplaceWithA256BitRandomKeyInProduction!
app.jwt.expiration-ms=86400000


# =============================================================================
#  CORS (Cross-Origin Resource Sharing)
#  The allowed origin is read by CorsConfig.java.
#  This is the URL where the frontend is served during development.
#  Adjust if you use a different port or a live server URL.
# =============================================================================
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000


# =============================================================================
#  SPRING SECURITY
#  Spring Boot auto-generates a random password for the default user
#  when Spring Security is on the classpath. We disable that here
#  because we manage users via the database + JWT.
# =============================================================================

# Disable Spring Boot's default security user (we use DB + JWT auth)
spring.security.user.name=disabled
spring.security.user.password=disabled


# =============================================================================
#  SPRING ACTUATOR (Health & Info Endpoints)
#  Exposed for development monitoring. Secured in SecurityConfig:
#    /actuator/health → PUBLIC (used by load balancers, Docker health checks)
#    /actuator/info   → PUBLIC
#    All others       → ADMIN role only
# =============================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

# App info shown at /actuator/info
info.app.name=ClickKart Backend
info.app.version=1.0.0
info.app.description=ClickKart e-commerce REST API
info.app.java-version=21


# =============================================================================
#  FILE UPLOAD (for product image uploads in future)
#  Limits the size of multipart form uploads.
# =============================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB


# =============================================================================
#  LOGGING
#  Levels: TRACE < DEBUG < INFO < WARN < ERROR
#
#  During development: set com.clickkart to DEBUG to see all service/repo logs.
#  Spring Security DEBUG shows every filter decision (helpful for auth debugging).
#  Set to INFO or WARN in production to reduce log noise.
# =============================================================================

# Root logger — keeps 3rd party libraries quiet unless they warn/error
logging.level.root=WARN

# Your application code — full debug output
logging.level.com.clickkart=DEBUG

# Spring Security filter chain decisions (very verbose — disable once auth is working)
logging.level.org.springframework.security=DEBUG

# Hibernate SQL logging — shows each query with bound parameters
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Web request mapping info
logging.level.org.springframework.web=INFO

# Log pattern — timestamp, level, thread, logger, message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{36}) : %msg%n
